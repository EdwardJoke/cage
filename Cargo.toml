[workspace]
members = ["examples/agent-p0", "examples/agent-p1", "cage-py"]

default-members = ["."]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
strip = "symbols"

[package]
name = "coplex-cage"
version = "0.1.0"
edition = "2024"
authors = ["Coplex"]
license = "Apache-2.0"
description = "Deterministic WASM sandbox for multi-agent orchestration"
repository = "https://codeberg.org/EdwardJoke/cage"
homepage = "https://codeberg.org/EdwardJoke/cage"
documentation = "https://docs.rs/coplex-cage"
readme = "README.md"
categories = ["wasm", "concurrency"]
keywords = ["wasm", "sandbox", "agent", "orchestration", "deterministic"]

[dependencies]
anyhow = "1.0.103"
base64 = "0.22.1"
clap = { version = "4.6.2", features = ["derive"] }
env_logger = "0.11.11"
getrandom = { version = "0.4.3", features = ["std"] }
log = "0.4.33"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
wasmtime = "46.0.1"
wasmtime-wasi = "46.0.1"
chrono = { version = "0.4.45", features = ["serde"] }
glob = "0.3"
